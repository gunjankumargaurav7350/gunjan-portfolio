trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: build
    displayName: Build & Test
    jobs:
      - job: web_build
        displayName: Build & Validate
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: |
              if [ -f package.json ]; then
                npm ci || npm install
                npm run build --if-present
              fi
            displayName: Build Assets
