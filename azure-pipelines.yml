trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Quality_Gate
  displayName: '🌐 Stage 1: Web Lint & Quality Gate'
  jobs:
  - job: Web_Validation
    displayName: 'Validate Web Assets & Security'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Setup Node.js 20.x'

    - script: |
        if [ -f package.json ]; then
          npm ci || npm install
          npm run build --if-present
        else
          echo "Static assets structurally verified."
        fi
      displayName: 'Build & Asset Verification'
